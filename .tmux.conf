set-option -g status-position top

unbind C-b

set-option -g prefix C-\\
bind-key C-\\ send-prefix

set-option -g default-shell /bin/zsh
set-option -g focus-events on
set-option -a terminal-features 'alacritty:RGB'
set-option -g history-limit 10000

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.3'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'

# Loaded explicitly (not just by tpm below) so the @catppuccin_status_* modules
# exist for the -F expansions that follow.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-left ""
set -g status-right-length 100
# -agF on cpu/battery: their placeholders must be inlined here before
# tmux-cpu/tmux-battery run, since those only rewrite status-left/right.
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_session}"

# odd/even window index alternate backgrounds; e|m is modulus (%% breaks when nested).
# After tpm, which re-sources catppuccin and would otherwise clobber these.
run '~/.tmux/plugins/tpm/tpm'

set -g window-status-format "#[fg=#{@thm_fg},bg=#{?#{e|m:#{window_index},2},#{@thm_surface_1},#{@thm_surface_0}}] #I:#W#F "
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{?#{e|m:#{window_index},2},#{@thm_mauve},#{@thm_blue}},bold] #I:#W#F "
set -g window-status-separator ""
